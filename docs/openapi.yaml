# 営業日報システム API の OpenAPI 定義
# このファイルは `npm run openapi:generate` で生成する。手で編集しない（定義元：src/openapi/・src/schemas/）
openapi: 3.1.0
info:
  title: 営業日報システム API
  version: 1.0.0
  description: |-
    docs/api.md の API 仕様を、Route Handler の入力チェックと同じ Zod スキーマから生成した定義。
    このファイルは `npm run openapi:generate` で生成する。手で編集しない。
servers:
  - url: /api/v1
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: nipo_session
      description: ログイン（A-01）で発行されるセッション Cookie（`HttpOnly`・`Secure`・`SameSite=Lax`）
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 更新系（POST / PUT / DELETE）で必須。値は `GET /auth/me`（A-03）の `csrf_token`
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
              description: 画面にそのまま表示できるメッセージ
              example: 入力内容に誤りがあります
            reason:
              anyOf:
                - $ref: "#/components/schemas/ConflictReason"
                - $ref: "#/components/schemas/ForbiddenReason"
            details:
              type: array
              items:
                $ref: "#/components/schemas/ValidationErrorDetail"
              description: 400 のときだけ。項目別のメッセージ
          required:
            - code
            - message
      required:
        - error
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - TOO_MANY_ATTEMPTS
        - INTERNAL_ERROR
      description: エラーの種類。HTTP ステータスと 1 対 1 に対応する
    ConflictReason:
      type: string
      enum:
        - REPORT_ALREADY_EXISTS
        - REPORT_LOCKED
        - REPORT_NOT_DRAFT
        - EMAIL_ALREADY_EXISTS
      description: 409 のときだけ返す理由。画面はこれで表示を切り替える。理由を区別する必要がない 409 では省略
    ForbiddenReason:
      type: string
      enum:
        - CSRF_TOKEN_INVALID
      description: CSRF トークン・Origin の確認に失敗した 403 のときだけ返す。画面の API クライアントは、トークンを取り直して 1 回だけ再送する。権限不足の 403 では省略
    ValidationErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: 項目のパス（`visit_records[0].content` の形式）。リクエスト全体のエラーは空文字
          example: visit_records[0].content
        message:
          type: string
          example: 訪問内容は必須です
      required:
        - field
        - message
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          description: ページ番号
          example: 1
        per_page:
          type: integer
          description: 1ページの件数
          example: 20
        total_count:
          type: integer
          description: 全体の件数
          example: 53
        total_pages:
          type: integer
          description: 全体のページ数（0 件なら 0）
          example: 3
      required:
        - page
        - per_page
        - total_count
        - total_pages
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        department:
          type:
            - string
            - "null"
        role:
          $ref: "#/components/schemas/Role"
        manager:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
          description: 上長。未設定なら null
        subordinates:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
            required:
              - id
              - name
          description: 直属の部下（有効な者のみ）。SC-02 の担当者セレクトに使う
        csrf_token:
          type: string
          description: 更新系 API の `X-CSRF-Token` ヘッダーに設定する値
      required:
        - id
        - name
        - email
        - department
        - role
        - manager
        - subordinates
        - csrf_token
    Role:
      type: string
      enum:
        - sales
        - manager
        - admin
    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        contact_person:
          type:
            - string
            - "null"
        phone:
          type:
            - string
            - "null"
        address:
          type:
            - string
            - "null"
        assigned_sales:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
          description: 担当営業。未設定なら null
        is_active:
          type: boolean
        created_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
        updated_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
      required:
        - id
        - name
        - contact_person
        - phone
        - address
        - assigned_sales
        - is_active
        - created_at
        - updated_at
    SalesStaff:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        department:
          type:
            - string
            - "null"
        role:
          $ref: "#/components/schemas/Role"
        manager:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
          description: 上長。未設定なら null
        is_active:
          type: boolean
        created_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
        updated_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
      required:
        - id
        - name
        - email
        - department
        - role
        - manager
        - is_active
        - created_at
        - updated_at
    SalesStaffDetail:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        department:
          type:
            - string
            - "null"
        role:
          $ref: "#/components/schemas/Role"
        manager:
          type:
            - object
            - "null"
          properties:
            id:
              type: integer
            name:
              type: string
          required:
            - id
            - name
          description: 上長。未設定なら null
        is_active:
          type: boolean
        created_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
        updated_at:
          type: string
          example: 2026-04-01T10:00:00+09:00
        subordinate_count:
          type: integer
          description: "直属の部下の人数（有効な人だけ。決定事項 #17）。SC-08 の無効化の警告（M-11）に使う"
      required:
        - id
        - name
        - email
        - department
        - role
        - manager
        - is_active
        - created_at
        - updated_at
        - subordinate_count
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
        checks:
          type: object
          properties:
            db:
              type: string
              enum:
                - ok
          required:
            - db
          description: "`check` で指定した項目の結果。指定しなければ省略"
      required:
        - status
  parameters: {}
paths:
  /auth/login:
    post:
      operationId: A-01
      summary: A-01 ログイン
      description: メールアドレスとパスワードで認証し、セッション Cookie（`nipo_session`）を発行する。認証不要。メールアドレスの違い・パスワードの違い・無効なアカウントは、すべて同じ 401 を返す。別のサイトの Origin からのリクエストは 403
      tags:
        - 認証
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: yamada@example.com
                password:
                  type: string
                  minLength: 1
                  maxLength: 256
                  example: Passw0rd
              required:
                - email
                - password
      responses:
        "200":
          description: ログインした。A-03 と同じ形式のユーザー情報を返す
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentUser"
                required:
                  - data
        "400":
          description: 入力チェックエラー（`VALIDATION_ERROR`）。`details` に項目別のメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限なし・CSRF トークンなし（`FORBIDDEN`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: A-02
      summary: A-02 ログアウト
      description: セッションを破棄し、セッション Cookie を消す
      tags:
        - 認証
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "204":
          description: ログアウトした
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限なし・CSRF トークンなし（`FORBIDDEN`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: A-03
      summary: A-03 ログインユーザー情報取得
      description: ログイン中のユーザーの情報と、更新系 API で使う CSRF トークンを返す
      tags:
        - 認証
      security:
        - sessionCookie: []
      responses:
        "200":
          description: ログイン中のユーザー
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/CurrentUser"
                required:
                  - data
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customers:
    get:
      operationId: M-01
      summary: M-01 顧客一覧取得
      description: 顧客名の昇順。全ロールが使える。管理者以外は `include_inactive` を指定しても無視し、有効な顧客だけを返す（日報入力の顧客選択に使う）
      tags:
        - 顧客マスタ
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: ページ番号（初期値 1）
          required: false
          description: ページ番号（初期値 1）
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: 1ページの件数（初期値 20、最大 100）
          required: false
          description: 1ページの件数（初期値 20、最大 100）
          name: per_page
          in: query
        - schema:
            type: string
            maxLength: 100
            description: 顧客名の部分一致
          required: false
          description: 顧客名の部分一致
          name: name
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            description: 担当営業の ID で絞り込む
          required: false
          description: 担当営業の ID で絞り込む
          name: assigned_sales_id
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
            description: "`true` で無効な顧客も含める。管理者以外は指定しても無視する（常に有効な顧客だけ）"
          required: false
          description: "`true` で無効な顧客も含める。管理者以外は指定しても無視する（常に有効な顧客だけ）"
          name: include_inactive
          in: query
      responses:
        "200":
          description: 顧客の一覧
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Customer"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
                required:
                  - data
                  - meta
        "400":
          description: 入力チェックエラー（`VALIDATION_ERROR`）。`details` に項目別のメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: M-02
      summary: M-02 顧客登録
      description: 管理者のみ。`is_active = true` で登録する。`Location` ヘッダーに作成した顧客の URL を付ける
      tags:
        - 顧客マスタ
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 顧客名
                  example: ABC商事
                contact_person:
                  type:
                    - string
                    - "null"
                  maxLength: 50
                  description: 先方担当者名
                  example: 田中様
                phone:
                  type:
                    - string
                    - "null"
                  maxLength: 20
                  pattern: ^(?:(?=(?:-?\d){10,11}$)0(?:[1-9]\d{8,9}|[1-9]\d{0,3}-\d{1,4}-\d{3,4}))?$
                  description: 電話番号。0 で始まる 10〜11 桁の数字で、ハイフンなしか「市外局番-市内局番-加入者番号」の形（例：03-1234-5678・090-1234-5678・0120-123-456）
                  example: 03-1234-5678
                address:
                  type:
                    - string
                    - "null"
                  maxLength: 200
                  description: 住所
                  example: 東京都千代田区丸の内1-1-1
                assigned_sales_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 2147483647
                  description: 担当営業の ID。有効な営業・上長であること。未設定なら null
                  example: 2
              required:
                - name
      responses:
        "201":
          description: 登録した顧客
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Customer"
                required:
                  - data
        "400":
          description: 入力チェックエラー（`VALIDATION_ERROR`）。`details` に項目別のメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限なし・CSRF トークンなし（`FORBIDDEN`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /customers/{id}:
    get:
      operationId: M-03
      summary: M-03 顧客詳細取得
      description: 管理者のみ
      tags:
        - 顧客マスタ
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            description: ID
            example: 10
          required: true
          description: ID
          name: id
          in: path
      responses:
        "200":
          description: 顧客
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Customer"
                required:
                  - data
        "400":
          description: 入力チェックエラー（`VALIDATION_ERROR`）。`details` に項目別のメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限なし・CSRF トークンなし（`FORBIDDEN`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 対象が存在しない、または閲覧権限がない（`NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: M-04
      summary: M-04 顧客更新
      description: 管理者のみ。M-02 の項目と `is_active` で置き換える（省略した任意項目は未設定になる）。無効にしても、過去の訪問記録からの参照は残る
      tags:
        - 顧客マスタ
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            maximum: 2147483647
            description: ID
            example: 10
          required: true
          description: ID
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 顧客名
                  example: ABC商事
                contact_person:
                  type:
                    - string
                    - "null"
                  maxLength: 50
                  description: 先方担当者名
                  example: 田中様
                phone:
                  type:
                    - string
                    - "null"
                  maxLength: 20
                  pattern: ^(?:(?=(?:-?\d){10,11}$)0(?:[1-9]\d{8,9}|[1-9]\d{0,3}-\d{1,4}-\d{3,4}))?$
                  description: 電話番号。0 で始まる 10〜11 桁の数字で、ハイフンなしか「市外局番-市内局番-加入者番号」の形（例：03-1234-5678・090-1234-5678・0120-123-456）
                  example: 03-1234-5678
                address:
                  type:
                    - string
                    - "null"
                  maxLength: 200
                  description: 住所
                  example: 東京都千代田区丸の内1-1-1
                assigned_sales_id:
                  type:
                    - integer
                    - "null"
                  minimum: 1
                  maximum: 2147483647
                  description: 担当営業の ID。有効な営業・上長であること。未設定なら null
                  example: 2
                is_active:
                  type: boolean
                  description: 有効なら true。無効にした顧客は日報入力の選択肢に出ない
              required:
                - name
                - is_active
      responses:
        "200":
          description: 更新後の顧客
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Customer"
                required:
                  - data
        "400":
          description: 入力チェックエラー（`VALIDATION_ERROR`）。`details` に項目別のメッセージ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未ログイン・セッション切れ・認証失敗（`UNAUTHENTICATED`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 権限なし・CSRF トークンなし（`FORBIDDEN`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 対象が存在しない、または閲覧権限がない（`NOT_FOUND`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: サーバーエラー（`INTERNAL_ERROR`）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /sales-staff:
    get:
      operationId: S-01
      summary: S-01 営業一覧取得
      description: 部署の昇順（部署なしは最後）→ 氏名の昇順。管理者は全員、上長は自分と直属の部下だけ、営業は 403
      tags:
        - 営業マスタ
      security:
        - sessionCookie: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
            description: ページ番号（初期値 1）
          required: false
          description: ページ番号（初期値 1）
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
            description: 1ページの件数（初期値 20、最大 100）
          required: false
