# ローカル開発・テスト用の PostgreSQL
#   起動：docker compose up -d
#   停止：docker compose stop
#   作り直し（データを全削除）：docker compose down -v && docker compose up -d
name: nipo

services:
  db:
    # Cloud SQL for PostgreSQL と同じメジャーバージョンに合わせる。
    # 照合順序（並び順）を Cloud SQL の既定（en_US.UTF8）とそろえるため、alpine ではなく Debian 版を使う
    image: postgres:17
    environment:
      POSTGRES_USER: nipo
      POSTGRES_PASSWORD: nipo
      # 開発用DB。テスト用DB（nipo_test）は docker/postgres/initdb の初期化スクリプトで作る
      POSTGRES_DB: nipo_dev
      TZ: UTC
    ports:
      # ホスト側のポートは .env の POSTGRES_PORT で変えられる（PC で別の PostgreSQL が 5432 番を使っていることが多いため）
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # 初回起動時（ボリュームが空のとき）だけ実行される
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 で TCP 経由で確認する。初回起動時は初期化用の仮のサーバーが Unix ソケットだけで動き、
      # 初期化スクリプトの実行後に再起動するため、ソケットで確認すると再起動前に「準備完了」と判定してしまう
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U nipo -d nipo_dev"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  db-data:
